<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: #000; }
      #stage { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: #000; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* box: 객체 주위 테두리 */
      .hl {
        position: absolute;
        opacity: 0;
        border: {{BORDER_PX}}px solid;
        border-radius: 8px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25);
      }
      /* zoom / shake: 슬라이드에서 객체 영역만 오려낸 조각. 같은 이미지를 배경으로 깔고 그 영역만 보이게 한다 */
      .cut {
        position: absolute;
        opacity: 0;
        background-repeat: no-repeat;
        background-size: {{W}}px {{H}}px;
        border-radius: 4px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      /* zoom-box: 조각에 테두리 링. box-shadow 라서 크기에 영향이 없다 */
      .cut.ring {
        box-shadow: 0 0 0 {{BORDER_PX}}px var(--ring), 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="slide"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="{{W}}"
      data-height="{{H}}"
      data-fps="{{FPS}}"
    >
      <img id="bg" class="clip" src="{{SLIDE_SRC}}" data-start="0" data-duration="{{DURATION}}" data-track-index="0" />
{{OBJECT_DIVS}}
      <audio id="narration" src="{{AUDIO_SRC}}" data-start="0" data-duration="{{DURATION}}" data-track-index="2" data-volume="1"></audio>
    </div>

    <!-- 주의: HyperFrames 컴파일러는 body 의 인라인 <script> 를 body 끝으로 옮긴다(외부 스크립트 뒤로).
         그래서 데이터는 인라인이 아니라 외부 파일(slide-data.js)로 넣어야 효과 스크립트보다 먼저 실행된다.
         효과 스크립트는 effects/ 폴더 순서대로 (common.js → 효과 파일들 → index.js). composition.builder 가 채운다. -->
    <script src="./assets/slide-data.js"></script>
    <script src="./assets/gsap.min.js"></script>
{{EFFECT_SCRIPTS}}
  </body>
</html>
